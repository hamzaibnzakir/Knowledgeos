<script>
const ICON={file:'<svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h6"/></svg>',spark:'<svg viewBox="0 0 24 24"><path d="m12 3 1.5 6.5L20 11l-6.5 1.5L12 19l-1.5-6.5L4 11l6.5-1.5z"/></svg>',bulb:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8 14a7 7 0 1 1 8 0c-1.2.8-1.7 1.7-1.9 3H9.9c-.2-1.3-.7-2.2-1.9-3Z"/></svg>'};
let notes=[],memories=[],chats=[],currentChatId=null,current=null,searchTimer=null;let longMessageStore={},expandedLongMessages={};
function renderChatMessage(m,i){let full=String(m.content||''),isPasted=full.length>3000,isLong=full.length>1200,collapsed=isPasted||isLong,id='long-msg-'+i+'-'+Math.random().toString(36).slice(2,7);if(collapsed){longMessageStore[id]={full:full,preview:full.slice(0,isPasted?620:900)+'…'};expandedLongMessages[id]=false}let text=collapsed?longMessageStore[id].preview:full;return '<article class="chat-message '+m.role+'"><div class="chat-message-avatar">'+(m.role==='user'?'You':'AI')+'</div><div class="chat-message-body">'+(isPasted?'<div class="pasted-content-label">Pasted content <span>'+full.length.toLocaleString()+' characters</span></div>':'')+'<div class="chat-message-meta">'+(m.role==='user'?'You':'Knowledge OS')+' <span>· '+timeAgo(m.created_at)+'</span></div><div class="chat-message-text '+(collapsed?'collapsed':'')+'" id="'+id+'">'+escapeHtml(text)+'</div>'+(collapsed?'<button class="view-more-button" onclick="toggleLongMessage(\''+id+'\',this)">View more</button>':'')+(m.role==='assistant'?'<div class="chat-message-actions"><button onclick="saveAssistantMemory(\''+encodeURIComponent(full)+'\')">Save to memory</button></div>':'')+'</div></article>'}
function toggleLongMessage(id,button){let item=longMessageStore[id];if(!item)return;let open=!expandedLongMessages[id];expandedLongMessages[id]=open;let el=document.getElementById(id);if(el){el.textContent=open?item.full:item.preview;el.classList.toggle('expanded',open);el.classList.toggle('collapsed',!open)}if(button)button.textContent=open?'Show less':'View more'}
function noteUrl(path,suffix=''){return '/api/notes/'+path.split('/').map(encodeURIComponent).join('/')+suffix}
async function api(url,opts){let r=await fetch(url,opts);if(!r.ok)throw Error(await r.text());return r.json()}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastT);window.toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function timeAgo(iso){if(!iso)return '';let d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago'}
function setActive(view,title){document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('pageTitle').textContent=title;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+view).classList.add('active');document.getElementById('sidebar').classList.remove('open')}
function showView(view){if(view==='dashboard'){setActive('dashboard','Overview');renderDashboard()}else if(view==='notes'){setActive('notes','All notes');renderNotes()}else if(view==='chat'){setActive('chat','AI conversations');renderChat()}else if(view==='graph'){setActive('graph','Knowledge graph');renderGraph()}else if(view==='memory'){setActive('memory','Memory');renderMemory()}else if(view==='skills'){renderSkills()}else if(view==='agents'){renderAgents()}else if(view==='mcp'){renderMcpConnections()}else if(view==='settings'){setActive('settings','Settings');renderSettings()}}
async function loadData(){try{[notes,memories,chats]=await Promise.all([api('/api/notes'),api('/api/memories'),api('/api/chats')]);document.getElementById('noteCount').textContent=notes.length;document.getElementById('memoryCount').textContent=memories.length;document.getElementById('chatCount').textContent=chats.length;renderDashboard()}catch(e){toast('Could not load workspace data')}}
function stat(label,val,sub,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><h2>'+val+'</h2><span class="trend">'+sub+'</span></div>'}
function noteRow(n){return '<div class="note-row" onclick="openNote(\''+encodeURIComponent(n.path)+'\')"><div class="note-file">'+ICON.file+'</div><div class="note-info"><b>'+escapeHtml(n.title||n.path)+'</b><small>'+escapeHtml(n.path)+(n.tags?' · '+escapeHtml(n.tags):'')+'</small></div><span class="note-date">'+timeAgo(n.updated_at)+'</span></div>'}
function renderDashboard(){let recent=notes.slice(0,6);document.getElementById('view-dashboard').innerHTML='<div class="hero"><div><div class="eyebrow">Your second brain</div><h1>Good to see you.</h1><p>Everything you know, connected and ready when you are.</p></div><div class="hero-actions"><button class="ghost" onclick="showView(\'graph\')">Explore graph</button><button class="primary" onclick="newNote()">+ Capture thought</button></div></div><div class="grid4">'+stat('Total notes',notes.length,'Vault is in sync',ICON.file)+stat('Connections',notes.reduce((a,n)=>a+(n.tags?n.tags.split(',').length:0),0),'Knowledge signals',ICON.spark)+stat('Intentional memories',memories.length,'Curated by you',ICON.bulb)+stat('AI readiness','Live','gpt-4o-mini active',ICON.spark)+'</div><div class="split"><div class="card"><div class="card-head"><h3>Recent notes</h3><button class="linkbtn" onclick="showView(\'notes\')">View all →</button></div><div class="note-list">'+(recent.length?recent.map(noteRow).join(''):'<div class="empty">Your vault is ready. Capture your first thought.</div>')+'</div></div><div class="card"><div class="card-head"><h3>Quick capture</h3><span>⌘ Enter to save</span></div><div class="quick"><textarea id="quickText" placeholder="What is on your mind? Start writing…" onkeydown="if((event.metaKey||event.ctrlKey)&amp;&amp;event.key===&quot;Enter&quot;)quickCapture()"></textarea><div class="quick-foot"><span>Saved to Notes / Inbox</span><button class="primary" onclick="quickCapture()">Save thought</button></div></div></div></div><div class="split" style="margin-top:16px"><div class="card"><div class="card-head"><h3>AI copilot</h3><span>gpt-4o-mini · private gateway</span></div><div class="quick"><textarea id="aiQuestion" style="height:92px" placeholder="Ask about your notes…"></textarea><div class="quick-foot"><span>Grounded in your vault</span><button class="primary" onclick="askAI()">Ask copilot</button></div><div id="aiAnswer" class="muted" style="margin-top:12px;line-height:1.5;white-space:pre-wrap"></div></div></div><div class="card"><div class="card-head"><h3>How it works</h3><span>Local-first retrieval</span></div><div class="quick"><p class="muted" style="font-size:12px;line-height:1.6;margin:0">Your question is sent through the private gateway with relevant Markdown context. Nothing is written to memory unless you choose to save it.</p></div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Activity</h3><span>Live workspace pulse</span></div><div class="activity"><div class="activity-row"><i class="actdot"></i><div>Knowledge OS is running locally<small>Service is healthy and persistent</small></div></div><div class="activity-row"><i class="actdot"></i><div>Search index is ready<small>'+notes.length+' notes available for retrieval</small></div></div><div class="activity-row"><i class="actdot"></i><div>Memory layer is intentional<small>'+memories.length+' curated memories stored</small></div></div></div></div>'}
function renderNotes(){document.getElementById('view-notes').innerHTML='<div class="hero"><div><div class="eyebrow">Knowledge library</div><h1>All notes</h1><p>Browse and shape the ideas that matter.</p></div><div class="hero-actions"><button class="ghost" onclick="reindex()">↻ Rebuild index</button><button class="primary" onclick="newNote()">+ New note</button></div></div><div class="card"><div class="card-head"><h3>'+notes.length+' notes in your vault</h3><span>Markdown source of truth</span></div><div class="note-list">'+(notes.length?notes.map(noteRow).join(''):'<div class="empty">No notes yet. Create one to get started.</div>')+'</div></div>'}

ch(el=>{el.onclick=()=>{graphState.focus=el.dataset.path;openNote(encodeURIComponent(el.dataset.path))};el.onmouseenter=()=>{let p=el.dataset.path;canvas.querySelectorAll('.og-node').forEach(x=>{let q=x.dataset.path,connected=q===p||graphState.edges.some(e=>(e.source===p&&e.target===q)||(e.target===p&&e.source===q));x.classList.toggle('dimmed',!connected)});};el.onmouseleave=()=>canvas.querySelectorAll('.og-node').forEach(x=>x.classList.remove('dimmed'));el.onpointerdown=e=>{e.stopPropagation();graphState.drag={path:el.dataset.path,x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)}});svg.onpointermove=e=>{if(!graphState.drag)return;graphState.panX+=e.movementX;graphState.panY+=e.movementY;graphApplyTransform()};svg.onpointerup=()=>graphState.drag=null;svg.onwheel=e=>{e.preventDefault();graphZoom(e.deltaY<0?.1:-.1)};graphApplyTransform()}

async function renderAgents(){let aa=await api('/api/agents');setActive('agents','Agents');document.getElementById('view-agents').innerHTML=`<div class="hero"><div><div class="eyebrow">Agent operating system</div><h1>Agents</h1><p>Every authenticated MCP client gets a stable identity, separate activity logs, and search-first operating context.</p></div><button class="ghost" onclick="renderAgents()">↻ Refresh</button></div><div class="card"><div class="card-head"><h3>${aa.length} registered agents</h3><span>Identity and activity registry</span></div><div class="note-list">${aa.length?aa.map(a=>`<div class="note-row"><div class="note-file">◉</div><div class="note-info"><b>${escapeHtml(a.name||a.client_id)}</b><small>${escapeHtml(a.provider||'MCP client')} · ${escapeHtml(a.model||'unknown')} · ${String(a.actions||0)} actions · ${String(a.retrievals||0)} retrievals · ${String(a.skills_used||0)} skills</small></div><span class="note-date">${escapeHtml(timeAgo(a.last_seen)||'offline')}</span></div>`).join(''):'<div class="empty">No authenticated MCP client has invoked a tool yet.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="setting-section"><h3>Operating policy</h3><p>Search first. Read only relevant notes or skills. Keep raw activity in agent logs and promote only meaningful discoveries into permanent knowledge.</p></div></div>`}
async function renderSkills(){let ss=await api('/api/skills');document.getElementById('skillCount').textContent=ss.length;setActive('skills','Skills');document.getElementById('view-skills').innerHTML='<div class="hero"><div><div class="eyebrow">Reusable intelligence</div><h1>Skills</h1><p>Upload Markdown, PDFs, screenshots, or documents. They stay as Markdown source files that any connected AI can use.</p></div><label class="primary" style="display:inline-flex;align-items:center;cursor:pointer">+ Upload skill<input type="file" accept=".pdf,.txt,.md,.csv,.json,.png,.jpg,.jpeg,.webp" style="display:none" onchange="uploadSkill(this)"></label></div><div class="card"><div class="card-head"><h3>'+ss.length+' skills in your library</h3><span>Markdown source of truth</span></div><div class="note-list">'+(ss.length?ss.map(s=>'<div class="note-row" onclick="openNote(\''+encodeURIComponent(s.path)+'\')"><div class="note-file">'+ICON.file+'</div><div class="note-info"><b>'+escapeHtml(s.title)+'</b><small>'+escapeHtml(s.path)+' · '+String(s.content||'').length.toLocaleString()+' characters</small></div><span class="note-date">'+timeAgo(s.updated_at)+'</span></div>').join(''):'<div class="empty">No skills yet. Upload a file and it will be extracted into a reusable Markdown skill.</div>')+'</div></div><div class="card" style="margin-top:16px"><div class="setting-section"><h3>How to file from chat</h3><p>Attach a file in AI Conversations, then tell the assistant exactly what to do, for example: <strong>“Save this as a skill.”</strong> Uploading alone only stages context and never creates a memory or skill.</p></div></div>'}
async function uploadSkill(input){let file=input.files[0];if(!file)return;let fd=new FormData();fd.append('file',file);let r=await fetch('/api/attachments',{method:'POST',body:fd});if(!r.ok){toast('Skill upload failed');return}let d=await r.json();let saved=await api('/api/skills/from-attachment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attachment_id:d.id})});toast(saved.created?'Skill added to your library':'That skill already exists');await loadData();renderSkills()}
async function renderMcpConnections(){
setActive('mcp','MCP connections');
let [info,connections]=await Promise.all([api('/api/mcp-info'),api('/api/mcp-connections')]);
let endpoint=escapeHtml(info.endpoint||''), token=String(info.auth_token||''), oauthId=String(info.oauth_client_id||''), oauthSecret=String(info.oauth_client_secret||''),
config=JSON.stringify({mcpServers:{'personal-knowledge-os':{url:info.endpoint,headers:{Authorization:'Bearer '+token}}}},null,2),
health=info.healthy?'<span class="mcp-health live"><i class="dot"></i>Online</span>':'<span class="mcp-health"><i class="dot"></i>Offline</span>',
rows=connections.length?connections.map(c=>'<div class="mcp-connection-row"><div class="mcp-platform-icon">◌</div><div class="mcp-connection-main"><b>'+escapeHtml(c.platform)+'</b><small>'+String(c.sessions||0)+' session'+(c.sessions===1?'':'s')+' · '+String(c.requests||0)+' request'+(c.requests===1?'':'s')+'</small></div><time>'+escapeHtml(timeAgo(c.last_seen)||'Not seen yet')+'</time></div>').join(''):'<div class="mcp-empty">No external platform has connected yet.</div>';
document.getElementById('view-mcp').innerHTML=`<div class="hero"><div><div class="eyebrow">External AI access</div><h1>MCP connections</h1><p>Connect an external AI app to your private notes, memory, skills, search, and graph. Follow the setup that matches your client.</p></div><div class="status">${health} ${info.configured?'Authentication active':'Authentication missing'}</div></div>
<div class="card mcp-guide"><div class="setting-section"><div class="eyebrow">Start here · required for every client</div><h3>Your MCP server URL</h3><p class="muted">This is the main address you give to every MCP-compatible AI app, whether it uses bearer authentication or OAuth.</p><div class="mcp-primary-url"><input id="mcpPrimaryEndpoint" value="${endpoint}" readonly><button class="primary" onclick="copyMcpValue('mcpPrimaryEndpoint','MCP server URL copied')">Copy MCP URL</button></div><div class="mcp-choice-grid"><div class="mcp-choice"><span class="mcp-step">A</span><div><b>Bearer token</b><small>Fastest and supported by most manual configurations.</small></div></div><div class="mcp-choice"><span class="mcp-step oauth">B</span><div><b>OAuth 2.1 + PKCE</b><small>Best for clients that support automatic browser authorization.</small></div></div></div></div></div>
<div class="card mcp-section"><div class="setting-section"><div class="card-head"><div><div class="eyebrow">Option A · manual setup</div><h3>Bearer token connection</h3></div><span class="mcp-badge">Copy these two values</span></div><p class="muted">Use this when the client has fields named <b>Server URL</b> and <b>Bearer token</b> or lets you paste a JSON configuration.</p><div class="mcp-copy-field"><label>1 · MCP server URL<input id="mcpEndpoint" value="${endpoint}" readonly></label><button class="primary" onclick="copyMcpEndpoint()">Copy URL</button></div><div class="mcp-copy-field"><label>2 · Bearer token<input id="mcpToken" type="password" value="${escapeHtml(token)}" readonly></label><button class="ghost" onclick="toggleMcpToken(this)">Reveal</button><button class="primary" onclick="copyMcpToken()">Copy token</button></div><pre id="mcpConfig">${escapeHtml(config)}</pre><button class="ghost" onclick="copyMcpConfig()">Copy complete JSON</button></div></div>
<div class="card mcp-section"><div class="setting-section"><div class="card-head"><div><div class="eyebrow">Option B · automatic setup</div><h3>OAuth 2.1 + PKCE</h3></div><span class="mcp-badge oauth">Browser authorization</span></div><p class="muted">Give the main MCP server URL above to an OAuth-capable AI app first. Use these individual controls only when the app asks for manual OAuth values.</p><div class="mcp-oauth-list"><div class="mcp-oauth-field"><label>OAuth server metadata</label><div class="mcp-field-row"><input id="oauthMetadata" readonly value="${escapeHtml(info.oauth_metadata||'')}"><button class="ghost" onclick="copyMcpValue('oauthMetadata','Metadata URL copied')">Copy</button></div></div><div class="mcp-oauth-field"><label>Client registration endpoint</label><div class="mcp-field-row"><input id="oauthRegistration" readonly value="${escapeHtml(info.oauth_registration||'')}"><button class="ghost" onclick="copyMcpValue('oauthRegistration','Registration URL copied')">Copy</button></div></div><div class="mcp-oauth-field"><label>OAuth client ID</label><div class="mcp-field-row"><input id="oauthClientId" readonly value="${escapeHtml(oauthId)}"><button class="ghost" onclick="copyMcpValue('oauthClientId','Client ID copied')">Copy</button></div></div><div class="mcp-oauth-field"><label>OAuth client secret</label><div class="mcp-field-row"><input id="oauthClientSecret" type="password" readonly value="${escapeHtml(oauthSecret)}"><button class="ghost" onclick="toggleMcpToken(this,'oauthClientSecret')">Reveal</button><button class="ghost" onclick="copyMcpValue('oauthClientSecret','Client secret copied')">Copy</button></div></div><div class="mcp-oauth-field"><label>Knowledge OS web redirect URI</label><div class="mcp-field-row"><input id="oauthRedirectUri" readonly value="${escapeHtml(info.oauth_redirect_uri||'')}"><button class="ghost" onclick="copyMcpValue('oauthRedirectUri','Redirect URI copied')">Copy</button></div></div><div class="mcp-oauth-field"><label>Claude callback URI</label><div class="mcp-field-row"><input id="oauthClaudeRedirectUri" readonly value="https://claude.ai/api/mcp/auth_callback"><button class="ghost" onclick="copyMcpValue('oauthClaudeRedirectUri','Claude callback copied')">Copy</button></div></div></div><button class="primary" onclick="copyOauthCredentials()">Copy OAuth credentials bundle</button></div></div>
<div class="card mcp-section"><div class="setting-section"><div class="card-head"><div><div class="eyebrow">Permissions</div><h3>What the AI can access</h3></div><span class="mcp-badge">Full access available</span></div><p class="muted">Authenticated clients can use the complete Knowledge OS toolset: list and read notes, search the vault, inspect backlinks and graph relationships, read skills and memories, create or update Markdown notes, save intentional memories, and delete approved items. Existing read-only OAuth tokens must reconnect to receive the write scope.</p><div class="mcp-scope-grid"><div><b>knowledge:read</b><small>List/read notes, search knowledge, read memories, graph relationships, backlinks, audit events, and skills.</small></div><div class="danger"><b>knowledge:write</b><small>Create and update notes, save memories, and delete approved notes or memories.</small></div></div></div></div>
<div class="card mcp-section"><div class="setting-section"><div class="card-head"><div><div class="eyebrow">Live activity</div><h3>Connected platforms</h3></div><span>Privacy-safe activity</span></div><p class="muted">Only platform name, request count, session count, and last-seen time are stored. Tokens and note content are never recorded.</p><div class="mcp-connections">${rows}</div></div></div>
<div class="card mcp-section"><div class="setting-section"><div class="card-head"><div><div class="eyebrow">Verification</div><h3>Server status</h3></div><span class="mcp-health live"><i class="dot"></i>Checked now</span></div><div class="mcp-checks"><div><span>✓</span><b>HTTPS endpoint</b><small>${escapeHtml(info.endpoint||'')}</small></div><div><span>✓</span><b>Streamable HTTP transport</b><small>${escapeHtml(info.transport||'')}</small></div><div><span>✓</span><b>Bearer authentication</b><small>${escapeHtml(info.auth||'')}</small></div><div><span>✓</span><b>OAuth discovery</b><small>Metadata and PKCE authorization endpoints available</small></div></div></div></div>`}
function copyMcpValue(id,msg){let x=document.getElementById(id);if(x)copyText(x.value,msg)} function toggleMcpToken(btn,id){let x=document.getElementById(id||'mcpToken');if(!x)return;x.type=x.type==='password'?'text':'password';btn.textContent=x.type==='password'?'Reveal':'Hide'} function copyOauthCredentials(){let id=document.getElementById('oauthClientId')?.value||'';let secret=document.getElementById('oauthClientSecret')?.value||'';let redirect=document.getElementById('oauthRedirectUri')?.value||'';let claude=document.getElementById('oauthClaudeRedirectUri')?.value||'';navigator.clipboard.writeText('OAuth client ID: '+id+'\nOAuth client secret: '+secret+'\nKnowledge OS redirect URI: '+redirect+'\nClaude callback URI: '+claude).then(()=>toast('OAuth credentials copied'))} function copyMcpEndpoint(){copyText(document.getElementById('mcpEndpoint').value,'MCP URL copied')}
function copyMcpConfig(){copyText(document.getElementById('mcpConfig').textContent,'Client config copied')}
async function renderAudit(){let rows=await api('/api/audit?limit=100');setActive('settings','Activity audit');document.getElementById('view-settings').innerHTML=`<div class="hero"><div><div class="eyebrow">Trust layer</div><h1>Activity audit</h1><p>Backend-confirmed actions from notes, memory, attachments, chat, and skills.</p></div><button class="ghost" onclick="renderSettings()">Back to settings</button></div><div class="card"><div class="card-head"><h3>${rows.length} recent events</h3><span>Server recorded</span></div><div class="note-list">${rows.length?rows.map(r=>`<div class="note-row"><div class="note-file">${r.status==='completed'?'✓':r.status==='duplicate'?'↺':'!'}</div><div class="note-info"><b>${escapeHtml(r.action)} · ${escapeHtml(r.status)}</b><small>${escapeHtml(r.created_at)} · ${escapeHtml(JSON.stringify(r.details||{}))}</small></div></div>`).join(''):'<div class="empty">No actions recorded yet.</div>'}</div></div>`}
async function renderSettings(){setActive('settings','Settings');let c=await api('/api/config');document.getElementById('view-settings').innerHTML='<div class="hero"><div><div class="eyebrow">Control center</div><h1>Settings</h1><p>Configure the private foundations of your second brain.</p></div></div><div class="settings"><div class="card"><div class="setting-section"><h3>AI provider</h3><p>The service is configured for OpenAI through a private environment file. The key is never written to the database or shown in the UI.</p><div class="status"><i class="dot"></i>'+(c.openai_configured?'OpenAI key detected · '+escapeHtml(c.model):'Waiting for OPENAI_API_KEY')+'</div></div></div><div class="card" style="margin-top:16px"><div class="setting-section"><h3>Vault maintenance</h3><p>Rebuild the searchable index and graph edges from your Markdown source of truth. This is safe to run at any time.</p><button class="ghost" onclick="reindex()">↻ Rebuild index</button></div></div><div class="card" style="margin-top:16px"><div class="setting-section"><h3>Activity audit</h3><p>See what the backend actually confirmed. This is the source of truth for saves, deletes, uploads, and AI actions.</p><button class="ghost" onclick="renderAudit()">Open activity audit</button></div></div><div class="card" style="margin-top:16px"><div class="setting-section"><h3>Local-first by design</h3><p>Your notes live in <code>data/vault</code>, while SQLite stores rebuildable indexes and intentional memories. The service runs independently on port 8787.</p></div></div></div>'}
const commands=[['Create a new note','newNote','N'],['Open AI conversations','showView("chat")',''],['Open all notes','showView(\'notes\')',''],['Open knowledge graph','showView(\'graph\')',''],['Open memory','showView(\'memory\')',''],['Rebuild index','reindex',''],['Open settings','showView(\'settings\')',''],['Open Skills','showView(\'skills\')',''],['Open MCP connections','showView(\'mcp\')','']];function openPalette(){document.getElementById('paletteBackdrop').classList.add('open');document.getElementById('paletteInput').value='';renderCommands(commands);setTimeout(()=>document.getElementById('paletteInput').focus(),30)}function closePalette(){document.getElementById('paletteBackdrop').classList.remove('open')}function renderCommands(xs){document.getElementById('paletteItems').innerHTML=xs.map(c=>'<div class="palette-item" onclick="closePalette();'+(c[1].includes('(')?c[1]:c[1]+'()')+'">'+c[0]+'<kbd>'+c[2]+'</kbd></div>').join('')}function filterCommands(q){renderCommands(commands.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())))}document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closePalette()});loadData();
</script>
