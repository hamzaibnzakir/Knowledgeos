[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-os"
version = "3.0.0"
description = "Private, local-first knowledge base and shared Markdown memory for AI agents, served over MCP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
local-embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
knowledge-os = "knowledge_os.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_os*"]

[tool.setuptools.package-data]
knowledge_os = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
